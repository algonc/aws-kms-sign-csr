name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "70.0"

jobs:
  validate:
    name: Validate Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Verify module
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check coverage
        shell: bash
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          if [[ -z "$coverage" ]]; then
            echo "::error::Unable to determine total test coverage."
            exit 1
          fi

          echo "Total coverage: ${coverage}%"
          echo "### Test coverage: ${coverage}%" >> "$GITHUB_STEP_SUMMARY"

          if ! awk -v coverage="$coverage" -v threshold="$COVERAGE_THRESHOLD" \
            'BEGIN { exit !(coverage + 0 >= threshold + 0) }'; then
            echo "::error::Test coverage ${coverage}% is below the required ${COVERAGE_THRESHOLD}%."
            exit 1
          fi

      - name: Check vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Build
        run: go build -trimpath -o /tmp/app .
